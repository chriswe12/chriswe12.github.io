<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Last-mile delivery high-level perception loop</title>
  <desc id="desc">Four-box flow diagram: explore in a GNSS-denied scene, detect and track candidates, verify with Qwen3-VL, then navigate to the target or continue exploration.</desc>
  <defs>
    <marker id="arrow" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#403e37"/>
    </marker>
    <marker id="arrow-blue" markerWidth="11" markerHeight="11" refX="9" refY="5.5" orient="auto" markerUnits="strokeWidth">
      <path d="M 0 0 L 11 5.5 L 0 11 z" fill="#0074ff"/>
    </marker>
    <style>
      .bg { fill: #f5f4ef; }
      .shadow { fill: #403e37; rx: 6; }
      .box { fill: #ffffff; stroke: #403e37; stroke-width: 2; rx: 6; }
      .title { fill: #000000; font: 700 25px Inter, Arial, sans-serif; }
      .subtitle { fill: #5e5b55; font: 500 14px Inter, Arial, sans-serif; }
      .label { fill: #0074ff; font: 700 12px 'JetBrains Mono', Consolas, monospace; letter-spacing: .4px; }
      .heading { fill: #000000; font: 700 21px Inter, Arial, sans-serif; }
      .body { fill: #5e5b55; font: 500 14px Inter, Arial, sans-serif; }
      .return-label { fill: #5e5b55; font: 600 13px Inter, Arial, sans-serif; }
      .arrow { stroke: #403e37; stroke-width: 2.2; fill: none; marker-end: url(#arrow); }
      .return { stroke: #0074ff; stroke-width: 2.2; fill: none; stroke-dasharray: 8 7; marker-end: url(#arrow-blue); }
    </style>
  </defs>

  <rect class="bg" width="1200" height="360"/>
  <text x="48" y="52" class="title">GNSS-denied last-mile delivery loop</text>
  <text x="48" y="78" class="subtitle">Fast detectors and DeepSORT run continuously. Qwen3-VL verifies only stable candidates.</text>

  <g id="box-explore">
    <rect class="shadow" x="54" y="126" width="250" height="150"/>
    <rect id="rect-explore" class="box" x="48" y="120" width="250" height="150"/>
    <g data-fit="rect-explore">
      <text x="70" y="148" class="label">01 EXPLORE</text>
      <text x="70" y="181" class="heading">GNSS-denied scene</text>
      <text class="body">
        <tspan x="70" y="213">No map, pose, heading,</tspan>
        <tspan x="70" y="235">or known search bounds.</tspan>
      </text>
    </g>
  </g>

  <g id="box-detect">
    <rect class="shadow" x="339" y="126" width="250" height="150"/>
    <rect id="rect-detect" class="box" x="333" y="120" width="250" height="150"/>
    <g data-fit="rect-detect">
      <text x="355" y="148" class="label">02 DETECT + TRACK</text>
      <text x="355" y="181" class="heading">Fast detections</text>
      <text class="body">
        <tspan x="355" y="213">YOLO or GroundingDINO,</tspan>
        <tspan x="355" y="235">tracked with DeepSORT.</tspan>
      </text>
    </g>
  </g>

  <g id="box-verify">
    <rect class="shadow" x="624" y="126" width="250" height="150"/>
    <rect id="rect-verify" class="box" x="618" y="120" width="250" height="150"/>
    <g data-fit="rect-verify">
      <text x="640" y="148" class="label">03 VERIFY</text>
      <text x="640" y="181" class="heading">Qwen3-VL check</text>
      <text class="body">
        <tspan x="640" y="213">Read house number or</tspan>
        <tspan x="640" y="235">confirm object candidate.</tspan>
      </text>
    </g>
  </g>

  <g id="box-act">
    <rect class="shadow" x="909" y="126" width="250" height="150"/>
    <rect id="rect-act" class="box" x="903" y="120" width="250" height="150"/>
    <g data-fit="rect-act">
      <text x="925" y="148" class="label">04 ACT</text>
      <text x="925" y="181" class="heading">Navigate or reject</text>
      <text class="body">
        <tspan x="925" y="213">Land at verified target,</tspan>
        <tspan x="925" y="235">or keep exploring.</tspan>
      </text>
    </g>
  </g>

  <path class="arrow" d="M 298 195 H 321"/>
  <path class="arrow" d="M 583 195 H 606"/>
  <path class="arrow" d="M 868 195 H 891"/>
  <path class="return" d="M 1028 270 V 318 H 173 V 282"/>
  <text x="444" y="331" class="return-label">Rejected address or false object returns to exploration.</text>
</svg>
